<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Drive with TVA Logistics</title>
<meta name="description" content="Still looking for the right seat? A lot has changed at TVA Logistics — W-2 pay, newer trucks, real home time. Tap to see if you still qualify.">
<meta name="theme-color" content="#0c0d10">

<!-- Link preview (SMS / social) -->
<meta property="og:type" content="website">
<meta property="og:title" content="Your seat at TVA Logistics is still open">
<meta property="og:description" content="Still looking for the right seat? W-2 pay, newer trucks, real home time — tap to see if you still qualify.">
<meta property="og:image" content="https://drive.tvalogistics.com/poster.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Your seat at TVA Logistics is still open">
<meta name="twitter:description" content="W-2 pay, newer trucks, real home time — tap to see if you still qualify.">
<meta name="twitter:image" content="https://drive.tvalogistics.com/poster.jpg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
  :root{
    --accent:#ce241c;
    --road:#0c0d10;
    --screen-ink:#f6f3ee;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:#000;
    color:var(--screen-ink);
    font-family:"Barlow",system-ui,-apple-system,sans-serif;
    line-height:1.4;
    display:flex;
    justify-content:center;
    -webkit-font-smoothing:antialiased;
  }

  /* full-screen vertical story; locked to 9:16 on wide screens, full-bleed on phones */
  .story{
    position:relative;
    width:min(100vw, calc(100dvh * 9 / 16));
    height:100dvh;
    overflow:hidden;
    background:var(--road);
    isolation:isolate;
    cursor:pointer;
    user-select:none;
  }

  .bgvid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;background:#0c0d10;
    transform:scale(1.06);transition:transform 3.4s ease;will-change:transform}
  .vhaze{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,transparent 22% 46%,rgba(0,0,0,.62) 100%)}

  /* story progress bars */
  .bars{position:absolute;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;z-index:5;display:flex;gap:4px}
  .bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.32);overflow:hidden}
  .bar>i{display:block;height:100%;width:0;background:#fff;border-radius:2px}
  .bar.done>i{width:100%}
  .bar.active>i{animation:fill 3s linear forwards}
  @keyframes fill{from{width:0}to{width:100%}}

  /* header */
  .head{
    position:absolute;top:calc(24px + env(safe-area-inset-top));left:16px;right:12px;z-index:5;
    display:flex;align-items:center;justify-content:space-between;gap:9px;
  }
  .brand{height:42px;width:auto;display:block;filter:drop-shadow(0 1px 6px rgba(0,0,0,.5))}
  .icon-btn{
    appearance:none;border:0;background:rgba(0,0,0,.25);color:#fff;
    width:38px;height:38px;display:grid;place-items:center;
    cursor:pointer;border-radius:50%;line-height:0;
  }
  .icon-btn:focus-visible{outline:2px solid #fff;outline-offset:2px}

  /* burned-in caption (works on mute) */
  .caption{
    position:absolute;left:20px;right:20px;bottom:172px;z-index:4;
    font-family:"Barlow Condensed",sans-serif;font-weight:700;
    font-size:clamp(32px,9.6vw,46px);line-height:.98;
    text-transform:uppercase;letter-spacing:.005em;
    text-shadow:0 3px 18px rgba(0,0,0,.78);
    text-wrap:balance;
  }
  .caption.anim{animation:capIn .55s cubic-bezier(.2,.85,.25,1) both}
  .caption em{font-style:normal;color:#ffcf46;display:inline-block;animation:pop .5s .1s both}
  @keyframes capIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.72);opacity:0}60%{transform:scale(1.07)}100%{transform:scale(1);opacity:1}}

  /* tappable CTA */
  .cta-wrap{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));z-index:6;
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .swipe{display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;opacity:.92}
  .chev{width:24px;height:24px;animation:bob 1.5s ease-in-out infinite}
  .swipe small{font-size:11px;letter-spacing:.04em;text-transform:uppercase}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .sticker{
    display:inline-flex;align-items:center;gap:11px;
    background:#fff;color:#141414;text-decoration:none;
    padding:15px 24px;border-radius:16px;font-weight:600;font-size:17px;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.65);
    transition:transform .12s ease;
    animation:glow 2.3s ease-in-out infinite;
  }
  @keyframes glow{
    0%,100%{box-shadow:0 12px 30px -10px rgba(0,0,0,.6)}
    50%{box-shadow:0 14px 44px -6px rgba(206,36,28,.55),0 0 0 4px rgba(255,255,255,.12)}
  }
  .sticker .lk{
    width:28px;height:28px;border-radius:8px;flex:none;
    background:var(--accent);color:#fff;display:grid;place-items:center;
  }
  .sticker:active{transform:scale(.96)}
  .sticker:focus-visible{outline:3px solid #fff;outline-offset:3px}

  @media (prefers-reduced-motion:reduce){
    .chev,.sticker,.caption.anim,.caption em{animation:none}
    .bar.active>i{animation:none;width:60%}
    .bgvid{transition:none}
  }
</style>
</head>
<body>
  <main class="story" id="story">
    <video class="bgvid" src="truck.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="auto" aria-hidden="true"></video>
    <div class="vhaze" aria-hidden="true"></div>

    <div class="bars" id="bars" aria-hidden="true"></div>

    <div class="head">
      <img class="brand" src="logo-tva-white.png" alt="TVA Logistics" width="157" height="75">
      <button class="icon-btn" id="mute" aria-label="Turn sound on" aria-pressed="true">
        <svg id="mIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>
        </svg>
      </button>
    </div>

    <div class="caption" id="cap"></div>

    <div class="cta-wrap">
      <div class="swipe" aria-hidden="true">
        <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 15 6-6 6 6"/></svg>
        <small>Tap to continue</small>
      </div>
      <!-- CHANGE THIS href to your pre-qualify / recruiter link -->
      <a class="sticker" id="cta" href="https://tvalogistics.com/for-drivers">
        <span class="lk" aria-hidden="true">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>
        </span>
        See if you still qualify
      </a>
    </div>
  </main>

<script>
  (function(){
    var caps = [
      'Still looking for <em>the right seat?</em>',
      'A lot has changed at <em>TVA&nbsp;Logistics.</em>',
      'It’s a <em>W-2</em> job — taxes &amp; benefits handled.',
      'Newer trucks. <em>3,500+ miles</em> a week.',
      'Real <em>home time.</em> One-day orientation.',
      'Quick gut-check: <em>a year+</em> on your Class A?',
      'Good with <em>3 weeks out?</em> You’re our kind of driver.',
      'Let’s get you <em>rolling.</em>'
    ];
    var DURATION = 3000;
    var cap = document.getElementById('cap');
    var barsWrap = document.getElementById('bars');
    var story = document.getElementById('story');
    var vid = document.querySelector('.bgvid');
    var moves = ['scale(1.06)','scale(1.18) translate(-3%,-4%)','scale(1.12) translate(4%,3%)','scale(1.16) translate(3%,-3%)','scale(1.1) translate(-4%,3%)','scale(1.08) translate(2%,2%)'];
    var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
    var i = 0, timer;

    // build progress bars to match the number of captions
    caps.forEach(function(){
      var b = document.createElement('div'); b.className = 'bar';
      b.appendChild(document.createElement('i'));
      barsWrap.appendChild(b);
    });
    var bars = Array.prototype.slice.call(barsWrap.children);

    function paint(){
      cap.innerHTML = caps[i];
      cap.classList.remove('anim'); void cap.offsetWidth; cap.classList.add('anim');
      if(vid && !reduce) vid.style.transform = moves[i % moves.length];
      bars.forEach(function(b,n){
        b.classList.toggle('done', n < i);
        b.classList.remove('active'); void b.offsetWidth;
        if(n === i) b.classList.add('active');
      });
    }
    function schedule(){ clearTimeout(timer); if(!reduce){ timer = setTimeout(next, DURATION); } }
    function next(){ i = (i + 1) % caps.length; paint(); schedule(); }
    function prev(){ i = (i - 1 + caps.length) % caps.length; paint(); schedule(); }

    paint(); schedule();

    // keep the muted background video rolling (some browsers pause autoplay)
    function keepPlaying(){ if(vid && vid.paused){ var p = vid.play(); if(p && p.catch){ p.catch(function(){}); } } }
    keepPlaying();
    document.addEventListener('visibilitychange', function(){ if(!document.hidden) keepPlaying(); });

    // real story feel: tap right = next, tap left = back (let the CTA and mute button do their own thing)
    story.addEventListener('click', function(e){
      if(e.target.closest('#cta') || e.target.closest('#mute')) return;
      keepPlaying();
      var r = story.getBoundingClientRect();
      if((e.clientX - r.left) < r.width * 0.35){ prev(); } else { next(); }
    });

    // sound toggle — actually unmutes the video
    var btn = document.getElementById('mute');
    var mIcon = document.getElementById('mIcon');
    var on = false; // starts muted for autoplay
    btn.addEventListener('click', function(){
      on = !on;
      vid.muted = !on;
      if(on){ vid.play(); }
      btn.setAttribute('aria-pressed', String(!on));
      btn.setAttribute('aria-label', on ? 'Turn sound off' : 'Turn sound on');
      mIcon.innerHTML = on
        ? '<path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
        : '<path d="M11 5 6 9H3v6h3l5 4z"/><line x1="22" y1="9" x2="16" y2="15"/><line x1="16" y1="9" x2="22" y2="15"/>';
    });
  })();
</script>
</body>
</html>
